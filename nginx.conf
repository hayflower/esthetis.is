server {
    listen 80;
    server_name www.esthetis.is;
    return 301 https://esthetis.is$request_uri;
}

server {
    listen 80 default_server;
    server_name _;

    # Redirect plain HTTP arriving through Cloudflare.
    if ($http_x_forwarded_proto = "http") {
        return 301 https://$host$request_uri;
    }

    root /usr/share/nginx/html;
    index index.html;

    # The privacy page says nothing here logs visitors. Keep it off.
    access_log off;

    server_tokens off;

    # script-src hash covers the JSON-LD block in index.html; recompute if it changes.
    # add_header inside a location drops these, so locations use `expires`.
    add_header Content-Security-Policy "default-src 'none'; style-src 'self'; font-src 'self'; img-src 'self'; script-src 'self' 'sha256-GQVY9KmmjlS7q9LFC7dTusOlu9v06H7GX3o5gqnhwZo='; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), interest-cohort=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    gzip on;
    gzip_types text/css application/javascript image/svg+xml text/plain;
    gzip_min_length 512;

    # /privacy serves privacy.html
    location / {
        try_files $uri $uri.html $uri/ =404;
    }

    # No /index.html redirect: it loops with `index`.
    location = /privacy.html { return 301 /privacy; }

    location = /.well-known/security.txt {
        default_type text/plain;
        charset utf-8;
    }

    location = /esthetis.asc {
        default_type application/pgp-keys;
    }

    # Clearsigned pages render as text.
    location ~ \.txt\.asc$ {
        default_type text/plain;
        charset utf-8;
    }

    location /fonts/ {
        expires 1y;
    }

    # Revalidate at the edge so deploys show up immediately.
    location ~* \.(css|js)$ {
        expires -1;
    }

    location ~ ^/(robots\.txt|sitemap\.xml)$ {
        expires -1;
    }

    error_page 404 /404.html;
    location = /404.html { internal; }
}
